name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: typecheck
        run: uv run mypy
      - name: test
        run: uv run pytest
      - name: bench (informational)
        run: uv run pytest -m bench --benchmark-only -q || true
